version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL:-jdbc:mysql://db:3306/farm_logistics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-root}
      - APP_JWTSECRET=${JWT_SECRET:-SecretKeyForFarmLogisticsApiThatShouldBeLongEnoughToMeetSecurityRequirements}
    networks:
      - farm-net

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=farm_logistics
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - farm-net

networks:
  farm-net:
    driver: bridge

volumes:
  db-data:
