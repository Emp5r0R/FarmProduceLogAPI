spring.application.name=logistics

# Database Configuration
spring.datasource.url=jdbc:mysql://db:3306/farm_logistics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwtSecret=SecretKeyForFarmLogisticsApiThatShouldBeLongEnoughToMeetSecurityRequirements
app.jwtExpirationMs=86400000
