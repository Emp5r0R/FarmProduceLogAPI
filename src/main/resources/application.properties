spring.application.name=logistics

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/farm_logistics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwtSecret=${JWT_SECRET:SecretKeyForFarmLogisticsApiThatShouldBeLongEnoughToMeetSecurityRequirements}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
